<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六帽黃金圈：社會創新實境解謎系統</title>
    <style>
        :root {
            --primary: #005088;
            --bg-color: #f3f0df;
            --text-main: #1e293b;
            --text-light: #64748b;
            --card-bg: #ffffff;
            --accent-yellow: #eab308;
            --success-green: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: '微軟正黑體', 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 600px;
            position: relative;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .page-indicator {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .home-btn {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
        }
        .home-btn:hover { background: rgba(255,255,255,0.3); }

        .content-area {
            padding: 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 首頁選單樣式 */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        @media (max-width: 480px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        .menu-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .menu-item:hover {
            border-color: var(--primary);
            background: #f0f7ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .menu-icon {
            font-size: 1.5rem;
            margin-right: 12px;
        }

        .menu-text-title {
            font-weight: bold;
            color: var(--primary);
            font-size: 0.95rem;
        }

        /* 任務卡與指引樣式 */
        .badge {
            display: inline-block;
            background: var(--bg-color);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .title {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 20px;
            line-height: 1.4;
            border-left: 5px solid var(--accent-yellow);
            padding-left: 15px;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-main);
        }

        .guideline-box {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 0 8px 8px 0;
        }

        .guideline-box strong {
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
            font-size: 1.05rem;
        }

        /* 密碼解密區塊 */
        .secret-box {
            background: #f0fdf4;
            border: 1px dashed var(--success-green);
            padding: 20px;
            border-radius: 8px;
            margin-top: 5px;
        }
        .secret-title {
            color: var(--success-green);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--success-green);
            padding-bottom: 5px;
        }
        .secret-item {
            margin-bottom: 12px;
            font-size: 1rem;
            line-height: 1.6;
        }
        .secret-item strong {
            color: var(--success-green);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: #f1f5f9;
            border-top: 1px solid #e2e8f0;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #003d6b; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        .btn-reveal { background: var(--success-green); }
        .btn-reveal:hover { background: #166534; }

        .type-label {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: white;
        }
    </style>
</head>

                team: "【食在溫暖：校園續食地圖】（社會企業與弱勢關懷創新優等）",
                team_why: "校園周邊自助餐與便當店每晚都有大量乾淨剩食丟棄，但同時學校附近有許多清寒獨居長輩與經濟弱勢家庭餐餐挨餓。",
                team_how: "解決商家的「食安法規恐懼」與「填寫麻煩」。志工團隊負責全額承擔運輸中的食安保險，並透過Line自動化機器人讓店家一鍵回報當晚剩食數量。",
                team_what: "建立【校園友善續食快配隊】。每天晚上8點，大學生志工騎機車至合作店家收取剩食，在半小時內送至社區發展協會，重新盛裝成精美的「福氣便當」分發給長輩，同時幫店家掛上「友善減碳餐廳」標章，提升店家商譽。"
            },
            {
                id: 9, icon: "📱", title: "媒體識讀與資訊安全",
                question: "「我們如何能設計一款簡單易懂的桌遊或情境短劇，幫助社區長輩提升防詐騙意識與媒體識讀能力？」",
                why: "長輩為什麼容易受騙？是因為貪心、孤單，還是對新科技的恐懼？我們想幫助他們建立的是「防備心」還是「自信心」？",
                how: "如果用傳統的上課說教，長輩一定睡著或聽不進去，我們如何透過桌遊或短劇的互動機制，讓防詐騙觀念自然融入且不傷自尊？",
                what: "這款桌遊或短劇的名稱是什麼？請具體列出裡面最核心的「三個詐騙情境關卡」或「角色設定」。",
                team: "【大腦防毒軟體進駐班】（青年在地推廣與防詐卓越團隊）",
                team_why: "社區長輩常常在Line群組轉傳假健康訊息，或落入高投報率、假檢警的詐騙陷阱，傳統發傳單宣導長輩根本看不懂。",
                team_how: "「用長輩的語言演長輩的事！」不講高深的資安專有名詞，把真實詐騙案例編寫成充滿本土劇風格的「爆笑情境互動短劇」，讓長輩在台下看戲、抓兇手。",
                team_what: "設計了實體情境遊戲《金孫保衛戰》。大學生到社區關懷據點，穿上道具服裝扮演「兩光詐騙犯」，讓長輩在遊戲中扮演「資深金牌探長」，用投票和抓密碼的方式破解假包裹、假投資情境，讓長輩在歡笑中長出抗體。"
            },
            {
                id: 10, icon: "🤝", title: "跨文化交流與新住民關懷",
                question: "「我們如何能舉辦一場結合異國美食與文化的交流市集，幫助本地學生與新住民建立更友善的互動關係？」",
                why: "為什麼平時本地人與新住民很少深交？這場市集除了「吃吃喝喝」，我們真正想打破的文化偏見或隱形標籤是什麼？",
                how: "辦市集需要場地和經費，且很容易淪為一次性湊熱鬧，我們如何設計「深度互動機制」，讓買賣雙方能產生真正的文化對話？",
                what: "這場文化交流市集的名稱是什麼？除了擺攤，哪三個「破冰互動環節」是這場市集絕對必備的？",
                team: "【香料共和國：舌尖上的新家鄉】（國際志工與多元文化共融傑出專案）",
                team_why: "社區中的東南亞移工與新住民姐妹常被貼上隱形標籤，雖然生活在同一個社區，卻因為語言與文化厚牆而從不交流。",
                team_how: "香料與美食是全世界共通的語言。拋開生硬的平權宣導，改由新住民姐妹擔任「香料主廚與文化導師」，讓美食市集變成一場大型的文化體驗課。",
                team_what: "在社區公園舉辦【東南亞星空香料市集】。設計「香料盲盒猜猜看」、「越式春捲手作工坊」等破冰遊戲。本地居民必須在各攤位向主廚學一句當地的讚美話才能獲得限定美食，透過舌尖上的交流，成功消弭社區中的文化偏見。"
            }
        ];

        let currentTopic = null;
        let currentStep = 0; // 0: 挑戰目標, 1: 藍帽指引, 2: 大解密

        const contentArea = document.getElementById('content-area');
        const pageIndicator = document.getElementById('page-indicator');
        const typeLabel = document.getElementById('type-label');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const controlsPanel = document.getElementById('controls-panel');
        const homeBtn = document.getElementById('home-btn');

        // 初始化：渲染首頁菜單
        function renderMenu() {
            currentTopic = null;
            currentStep = 0;
            homeBtn.style.display = "none";
            controlsPanel.style.display = "none";
            pageIndicator.innerText = "請選擇挑戰主題";
            typeLabel.innerText = "MENU";
            typeLabel.style.background = "rgba(255,255,255,0.2)";

            let menuHTML = `<div class="menu-grid">`;
            topics.forEach(t => {
                menuHTML += `
                    <button class="menu-item" onclick="selectTopic(${t.id})">
                        <span class="menu-icon">${t.icon}</span>
                        <div style="display:flex; flex-direction:column;">
                            <span style="font-size:0.75rem; color:var(--text-light)">主題 0${t.id}</span>
                            <span class="menu-text-title">${t.title}</span>
                        </div>
                    </button>
                `;
            });
            menuHTML += `</div>`;
            contentArea.innerHTML = menuHTML;
        }

        // 選擇主題
        function selectTopic(id) {
            currentTopic = topics.find(t => t.id === id);
            currentStep = 0;
            homeBtn.style.display = "block";
            controlsPanel.style.display = "flex";
            renderStep();
        }

        // 渲染任務內容的各個步驟
        function renderStep() {
            // 觸發動畫重新播放
            contentArea.style.animation = 'none';
            contentArea.offsetHeight; // 觸發 reflow
            contentArea.style.animation = 'fadeIn 0.25s ease-in-out';

            if (currentStep === 0) {
                // 步驟一：HMW 核心挑戰目標
                pageIndicator.innerText = `主題 ${currentTopic.id} (第 1 / 3 階段)`;
                typeLabel.innerText = "📍 核心挑戰目標";
                typeLabel.style.background = "var(--primary)";
                
                contentArea.innerHTML = `
                    <div class="badge">${currentTopic.icon} ${currentTopic.title}</div>
                    <div class="title" style="font-size: 1.4rem; border-left-color: var(--primary);">
                        下午暑期執行方案發想主題：
                    </div>
                    <div class="description" style="font-size:1.25rem; font-weight:bold; line-height:1.6; background:#f1f5f9; padding:20px; border-radius:8px;">
                        ${currentTopic.question}
                    </div>
                `;
                btnPrev.innerText = "返回選單";
                btnNext.innerText = "下一步：主持指引";
                btnNext.className = "";
            } 
            else if (currentStep === 1) {
                // 步驟二：黃金圈引導藍帽指引
                pageIndicator.innerText = `主題 ${currentTopic.id} (第 2 / 3 階段)`;
                typeLabel.innerText = "🎯 藍帽六帽指引";
                typeLabel.style.background = "#eab308";
                
                contentArea.innerHTML = `
                    <div class="badge">${currentTopic.icon} ${currentTopic.title}</div>
                    
                    <div class="guideline-box">
                        <strong>【第一輪：確立 WHY (為什麼做)】</strong>
                        ${currentTopic.why}
                    </div>
                    
                    <div class="guideline-box" style="border-left-color: #1f2937;">
                        <strong style="color: #1f2937;">【第二輪：激辯 HOW (如何做)】</strong>
                        ${currentTopic.how}
                    </div>
                    
                    <div class="guideline-box" style="border-left-color: #3b82f6;">
                        <strong style="color: #3b82f6;">【第三輪：收斂 WHAT (做什麼)】</strong>
                        ${currentTopic.what}
                    </div>
                `;
                btnPrev.innerText = "上一步";
                btnNext.innerText = "💥 揭密全國獲獎案例";
                btnNext.className = "btn-reveal";
            } 
            else if (currentStep === 2) {
                // 步驟三：青志獎獲獎團隊大解密
                pageIndicator.innerText = `主題 ${currentTopic.id} (第 3 / 3 階段)`;
                typeLabel.innerText = "🏆 全國獲獎團隊解密";
                typeLabel.style.background = "var(--success-green)";
                
                contentArea.innerHTML = `
                    <div class="badge" style="background:#dcfce7; color:var(--success-green);">真實卓越案例</div>
                    <div class="title" style="font-size:1.3rem; border-left-color:var(--success-green); margin-bottom:10px;">
                        ${currentTopic.team}
                    </div>
                    
                    <div class="secret-box">
                        <div class="secret-title">✨ 他們是怎麼辦到的？</div>
                        <div class="secret-item">
                            <strong>💡 為什麼做 (WHY)：</strong>${currentTopic.team_why}
                        </div>
                        <div class="secret-item">
                            <strong>🛠️ 怎麼去做 (HOW)：</strong>${currentTopic.team_how}
                        </div>
                        <div class="secret-item">
                            <strong>🚀 具體行動 (WHAT)：</strong>${currentTopic.team_what}
                        </div>
                    </div>
                `;
                btnPrev.innerText = "上一步";
                btnNext.innerText = "完成！回議題選單";
                btnNext.className = "";
            }
        }

        function nextStep() {
            if (currentStep < 2) {
                currentStep++;
                renderStep();
            } else {
                renderMenu();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            } else {
                renderMenu();
            }
        }

        function goHome() {
            renderMenu();
        }

        // 初始開機直接進入首頁選單
        renderMenu();
    </script>
</body>
</html>
